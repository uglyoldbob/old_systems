name: Ubuntu Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Checkout xbuild
      run: git clone https://gitlab.com/thomas.epperson/xbuild.git
    - name: Setup 'xbuild'
      working-directory: ./xbuild/xbuild
      run: cargo install --path .
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libasound2-dev libudev-dev libdbus-1-dev \
          libgstreamer1.0-dev libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad libglib2.0-dev libgstreamer-plugins-base1.0-dev
    - name: Build
      working-directory: ./nes/rust
      run: x build --arch arm64 --platform android
