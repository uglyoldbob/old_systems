name: IOS Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Add Android LLVM tools to PATH
      shell: bash
      run: |
        LLVM_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/darwin-$(uname -m)/bin"
        echo "$LLVM_BIN" >> "$GITHUB_PATH"
    - name: Verify LLVM tools
      run: |
        which llvm-ar
        llvm-ar --version
    - name: Checkout xbuild
      run: git clone https://gitlab.com/thomas.epperson/xbuild.git
    - name: Setup 'xbuild'
      working-directory: ./xbuild/xbuild
      run: cargo install --path .
    - name: Build with xbuild
      working-directory: ./nes/rust
      run: x build --platform=ios --arch=arm64
