[package]
name = "ugly_old_controller"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type=["lib", "cdylib"]

[dependencies]
anyhow = "1.0.100"
bincode = "1.3.3"
bluetooth-rust = { version = "0.4.0", features = ["sync"] }
byteorder = "1.5.0"
controller = { path = "../controller" }
enum_dispatch = "0.3.13"
getrandom = "0.2"
lazy_static = "1.5.0"
log = "0.4"
ouroboros = "0.18.5"
serde = {version = "1.0.228", features = ["derive"]}
thiserror = "1.0"
time = "0.3.34"
toml = "0.9.11"

[target.'cfg(target_os = "android")'.dependencies]
jni = {version = "0.21.1", features = ["invocation", "default"] }
jni-min-helper = "0.4.1"

[target.'cfg(not(target_os = "android"))'.dependencies.eframe]
version = "0.34.2"
default-features = false

[target.'cfg(target_os = "android")'.dependencies.android_logger]
version = "0.15"
default-features = false

[target.'cfg(target_os = "android")'.dependencies.eframe]
version = "0.34.2"
default-features = false
features = [
    "wgpu",
    "android-native-activity",
    "default_fonts",
]

[target.'cfg(target_os = "android")'.dependencies.wgpu]
version = "27.0.1"
default-features = false
features = [
    "gles",
]

# Used to get same winit used by eframe.
[target.'cfg(target_os = "android")'.dependencies.egui-winit]
version = "0.34.2"
default-features = false
features = [
    "clipboard",
    "links",
]
