[package]
name = "android"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type=["lib", "cdylib"]

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0.100"
enum_dispatch = "0.3.13"
getrandom = "0.2"
lazy_static = "1.5.0"
log = "0.4"
ouroboros = "0.18.5"
pem-rfc7468 = "0.7"
rand = { version = "0.8", features = ["getrandom", "std"] }
rand_chacha = { version = "0.9.0", features = ["os_rng"] }
reqwest = { version = "0.12.26", default-features = false, features = ["rustls-tls", "blocking"] }
rsa = "0.9.6"
serde = {version = "1.0.219", features = ["derive"]}
thiserror = "1.0"
time = "0.3.34"
toml = "0.9.11"
url_encoded_data = "0.6.1"
x509-cert = "0.2.5"
zeroize = "1.7.0"

[dependencies.pkcs8]
version = "0.10.2"
features = ["encryption", "pem", "std"]

[dependencies.cert-common]
version = "0.2.5"
git = "https://github.com/uglyoldbob/cert-common.git"

[dependencies.rcgen]
version = "0.13.0"
git = "https://github.com/uglyoldbob/rcgen.git"
branch = "attributes"
features = ["ring", "pem", "x509-parser"]

[target.'cfg(target_os = "android")'.dependencies]
jni = {version = "0.21.1", features = ["invocation", "default"] }
jni-min-helper = "0.3.0"

[target.'cfg(not(target_os = "android"))'.dependencies.eframe]
version = "0.34.2"
default-features = false

[target.'cfg(target_os = "android")'.dependencies.android_logger]
version = "0.15"
default-features = false

[target.'cfg(target_os = "android")'.dependencies.eframe]
version = "0.34.2"
default-features = false
features = [
    "wgpu",
    "android-native-activity",
    "default_fonts",
]

[target.'cfg(target_os = "android")'.dependencies.wgpu]
version = "27.0.1"
default-features = false
features = [
    "gles",
]

# Used to get same winit used by eframe.
[target.'cfg(target_os = "android")'.dependencies.egui-winit]
version = "0.34.2"
default-features = false
features = [
    "clipboard",
    "links",
]
